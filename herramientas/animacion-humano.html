<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Revisor de animación · Personaje humano</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #10100f;
    color: #e7ddc2;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-wrap: wrap;
    min-height: 100vh;
  }
  #stage {
    flex: 1 1 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 60vh;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,255,255,.05), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 34px),
      #171612;
  }
  canvas { image-rendering: crisp-edges; }
  #hud {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 12px;
    opacity: .7;
    line-height: 1.5;
  }
  #panel {
    flex: 0 0 340px;
    max-width: 100vw;
    padding: 18px;
    background: #171612;
    border-left: 1px solid rgba(231,221,194,.12);
    overflow-y: auto;
    max-height: 100vh;
  }
  h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { font-size: 11px; opacity: .55; margin-bottom: 18px; }
  fieldset {
    border: 1px solid rgba(231,221,194,.16);
    border-radius: 8px;
    margin-bottom: 14px;
    padding: 10px 12px 12px;
  }
  legend { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .65; padding: 0 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  button, select {
    background: #23211b;
    color: #e7ddc2;
    border: 1px solid rgba(231,221,194,.22);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12.5px;
    cursor: pointer;
  }
  button:hover { background: #2d2a22; }
  button.active { background: #6b5a2c; border-color: #d7af5d; color: #fff0cf; }
  select { width: 100%; margin-bottom: 8px; }
  label.inline { display: flex; align-items: center; gap: 7px; font-size: 12.5px; margin-bottom: 6px; }
  input[type="range"] { flex: 1; }
  .slider-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; }
  .slider-row span:first-child { width: 76px; opacity: .75; }
  .slider-row b { width: 40px; text-align: right; opacity: .85; }
</style>
</head>
<body>

<div id="stage">
  <div id="hud">Revisor de animación · humano<br><span id="hud-info"></span></div>
  <canvas id="preview" width="560" height="560"></canvas>
</div>

<div id="panel">
  <h1>Revisor de animación</h1>
  <div class="sub">Usa el mismo motor real (characterAdapter.js + westerosRenderer.js). No toca archivos del juego.</div>

  <fieldset>
    <legend>Dirección</legend>
    <div class="row" id="dir-buttons"></div>
  </fieldset>

  <fieldset>
    <legend>Acción</legend>
    <div class="row" id="action-buttons"></div>
    <label class="inline"><input type="checkbox" id="loop-toggle" checked /> Repetir golpe / conjuro / daño en bucle</label>
  </fieldset>

  <fieldset>
    <legend>Arma principal</legend>
    <select id="weapon-select"></select>
    <legend style="margin-top:4px">Mano secundaria</legend>
    <select id="offhand-select"></select>
  </fieldset>

  <fieldset>
    <legend>Armadura de torso</legend>
    <select id="chest-select"></select>
    <label class="inline"><input type="checkbox" id="cloak-toggle" /> Capa</label>
    <label class="inline"><input type="checkbox" id="robe-toggle" /> Túnica</label>
  </fieldset>

  <fieldset>
    <legend>Reproducción</legend>
    <div class="slider-row"><span>Velocidad</span><input type="range" id="speed" min="10" max="200" value="100" /><b id="speed-val">1.0x</b></div>
    <div class="slider-row"><span>Zoom</span><input type="range" id="zoom" min="40" max="300" value="134" /><b id="zoom-val">1.34</b></div>
  </fieldset>
</div>

<script>
/* ── js/core/state.js (incrustado, motor real del juego) ── */
(function (U) {
  // Cache de selectores: cada '#id' se resuelve una sola vez.
  // Si un nodo llegara a salir del DOM (isConnected=false), se vuelve a buscar solo.
  U.$ = (() => {
    const cache = new Map();
    return s => {
      let el = cache.get(s);
      if (el === undefined || (el && !el.isConnected)) {
        el = document.querySelector(s);
        cache.set(s, el);
      }
      return el;
    };
  })();
  U.$$ = s => [...document.querySelectorAll(s)];
  // Cada cuanto se refresca el HUD (12 veces por segundo en vez de 60).
  U.HUD_INTERVAL = 1 / 12;
  U.hudClock = 0;
  U.RESPAWN_MS = 240000; // 4 min para que reaparezca un enemigo
  U.INV_SLOTS = 40; // casillas de inventario del jugador
  U.CAST_SLOW = 0.4; // al canalizar te mueves al 40% de tu velocidad
  U.DEATH_HOLD = 1.8; // segundos que dura la muerte antes de reaparecer
  U.CAST_INTERRUPT_ON_HIT = false; // ponlo en true si quieres que el dano corte el conjuro
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  U.rnd = (a, b) => a + Math.random() * (b - a);
  U.pick = a => a[Math.floor(Math.random() * a.length)];
  U.state = {
    battle: false,
    autoAttack: false,
    selectedSpell: null,
    safeZone: true,
    contextAction: 'use',
    time: 0,
    day: 0.35,
    messages: [],
    corpses: [],
    projectiles: [],
    effects: [],
    houses: [{ city: 'Valdoria', owned: true, chests: 2, shop: true }],
    bank: [],
    vendor: null,
    currentCorpse: null,
    selectedVendor: null,
    selectedBank: null,
    titles: [],
  };
  U.player = {
    name: 'Pitiao',
    str: 50,
    dex: 50,
    int: 20,
    statProgress: { str: 0, dex: 0, int: 0 },
    maxWeight: 100,
    x: 2,
    y: 3,
    z: 0,
    vx: 0,
    vy: 0,
    speed: 5.4,
    hp: 120,
    maxHp: 120,
    mana: 90,
    maxMana: 90,
    stam: 100,
    maxStam: 100,
    dead: false,
    respawn: { x: 1, y: 1, name: 'Centro de Valdoria' },
    target: null,
    attackCd: 0,
    spellCd: 0,
    healCd: 0,
    bandaging: null,
    recoveryBoost: 0,
    knownSpells: [],
    favoriteSpells: [],
    gold: 100,
    inventory: [],
    equipment: {},
    skills: {},
    skillLocks: {},
    newbie: true,
    playTime: 0,
    anim: 0,
    attackAnim: 0,
    hitAnim: 0,
    deathAnim: 0,
    facing: 'down',
  };
  for (const cat in U.SKILLS)
    for (const s of U.SKILLS[cat]) {
      U.player.skills[s] = ['Espada', 'Magia', 'Curar', 'Tácticas', 'Bloquear'].includes(s) ? 20 : 0;
      U.player.skillLocks[s] = 'up';
    }
  U.camera = { x: 0, y: 0 };
  U.input = { keys: {}, jx: 0, jy: 0 };
  U.npcs = [];
  U.enemies = [];
  U.toast = function (msg) {
    const n = document.createElement('div');
    n.className = 'toast';
    n.textContent = msg;
    U.$('#toasts').append(n);
    setTimeout(() => n.remove(), 2900);
  };
  U.SKILL_CAP = 100;
  U.SKILL_TOTAL_CAP = 700;
  U.raiseSkill = function (name, amt) {
    if (U.player.skillLocks[name] !== 'up') return;
    const old = U.player.skills[name] || 0,
      total = Object.values(U.player.skills).reduce((sum, value) => sum + value, 0),
      room = Math.max(0, U.SKILL_TOTAL_CAP - total),
      next = Math.min(U.SKILL_CAP, old + Math.min(amt, room));
    if (next <= old) return;
    U.player.skills[name] = next;
    const oldInt = Math.floor(old),
      newInt = Math.floor(next);
    if (newInt > oldInt) {
      U.skillNotice(name, newInt, true);
      const ix = (U.titleThresholds || []).indexOf(newInt);
      if (ix >= 0) {
        const rank =
          (U.titleRanks[name] || [])[ix] ||
          [
            'el Aprendiz',
            'el Practicante',
            'el Experto',
            'el Veterano',
            'el Maestro',
            'el Gran Maestro',
            'la Leyenda',
          ][ix];
        const title = `${rank} ${U.player.name}`;
        if (!U.state.titles.includes(title)) U.state.titles.push(title);
        U.toast(`Nuevo título: ${title}`);
      }
    } else U.skillNotice(name, next, false);
  };
  U.skillNotice = function (name, value, major) {
    const host = U.$('#level-notices');
    if (!host) return;
    const n = document.createElement('div');
    n.className = 'skill-notice ' + (major ? 'major' : 'minor');
    n.innerHTML = major
      ? `<b>${name} ${Math.floor(value)}</b><span>¡Nuevo nivel!</span>`
      : `<span>${name} +${value.toFixed(1)}</span>`;
    host.append(n);
    setTimeout(() => n.remove(), major ? 2600 : 1300);
  };
  U.raiseStat = function (stat, amount) {
    const labels = { str: 'Fuerza', dex: 'Destreza', int: 'Inteligencia' },
      p = U.player;
    p.statProgress = p.statProgress || { str: 0, dex: 0, int: 0 };
    if (!labels[stat] || p[stat] >= 150 || p.str + p.dex + p.int >= 700) return;
    p.statProgress[stat] = (p.statProgress[stat] || 0) + amount;
    if (p.statProgress[stat] + 1e-9 < 1) return;
    p.statProgress[stat] -= 1;
    p[stat] = Math.min(150, p[stat] + 1);
    const host = U.$('#level-notices');
    if (host) {
      const n = document.createElement('div');
      n.className = 'skill-notice major';
      n.innerHTML = `<b>¡${labels[stat]} subió a ${p[stat]}!</b><span>Atributo mejorado por práctica</span>`;
      host.append(n);
      setTimeout(() => n.remove(), 2800);
    }
    U.ui?.refreshHUD?.();
  };
})((window.Ultra = window.Ultra || {}));

</script>

        hit: options.pose ? 0 : Math.min(1, (actor.hitAnim || 0) / 0.22),

        dying: !options.pose && !!actor.dead && (actor.deathAnim || 0) > 0,
        weapon: player || type === 'guard' ? weapon(actor) : 'none',
        main: hands.main,

        shieldColor: slotColor(actor, 'shield', '#756a5e'),

              arms: layer(actor, 'arms') === 'clothing',

        tunic: player && equipped(actor, 'robe'),
        scale: player ? 1 : actor.variant === 'exalted' ? 1.45 : actor.variant === 'renowned' ? 1.25 : 1,
      };

  };

              ? 'none'
              : 'none';
      if (state.main === 'none') state.off = 'none';
    } else {
      if (state.off === 'spellbook') state.main = state.main === 'staff' ? 'staff' : 'none';
      else if (isTwoHanded(state.main) || state.main === 'staff') state.main = 'sword';
      else if (state.main === 'none') state.main = 'sword';
    }
    return e;
  }
  const hasShield = () => state.off === 'shield';
  const hasSpellbook = () => state.off === 'spellbook';
  const isDualWield = () => ['dagger', 'axe', 'sword', 'mace'].includes(state.off);
  const usesTwoHandGrip = () => isTwoHanded(state.main) && state.main !== 'bow';

  /* ══════════════════════════════════════════════════════════════════
   3 · SISTEMA DE ANIMACIÓN — clips con curvas propias
   ══════════════════════════════════════════════════════════════════ */
  const CLIPS = {
    idle: { dur: 2.6, loop: true },
    walk: { dur: 0.92, loop: true },
    melee: { dur: 0.78, loop: true },
    cast: { dur: 1.55, loop: true },
    hurt: { dur: 0.7, loop: true },
    death: { dur: 1.7, loop: false },
  };
  /* Canales de pose. Todo lo que dibuja lee de aquí, nunca de time directo. */
  const P = {
    bob: 0,
    breath: 0,
    torsoTwist: 0,
    torsoLean: 0,
    headTilt: 0,
    headY: 0,
    legPhase: 0,
    armPhase: 0,
    swing: 0,
    thrust: 0,
    guard: 0,
    castCharge: 0,
    castBurst: 0,
    recoil: 0,
    flash: 0,
    fall: 0,
    alpha: 1,
    sink: 0,
    capeLift: 0,
    capeSway: 0,
  };
  let clipT = 0,
    clipDone = false;
  const eOutCubic = t => 1 - Math.pow(1 - t, 3);
  const eInCubic = t => t * t * t;
  const eOutBack = t => {
    const c = 2.2;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  };
  const eOutElastic = t =>
    t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
  const eInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const seg01 = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));

  function resetPose() {
    for (const k in P) P[k] = 0;
    P.alpha = 1;
  }

  function updateAnim(dt) {
    if (state.paused) dt = 0;
    const act = state.tab === 'humans' ? state.action : state.beastAction;
    const clip = CLIPS[act] || CLIPS.idle;
    clipT += dt;
    if (clipT >= clip.dur) {
      if (clip.loop) clipT %= clip.dur;
      else {
        clipT = clip.dur;
        clipDone = true;
      }
    }
    const t = clipT / clip.dur; // 0..1 normalizado
    resetPose();

    if (act === 'idle') {
      /* Respiración en dos tiempos + micro balanceo + peso alternado */
      P.breath = Math.sin(t * Math.PI * 2);
      P.bob = Math.sin(t * Math.PI * 2) * 1.8 + Math.sin(t * Math.PI * 4) * 0.5;
      P.torsoTwist = Math.sin(t * Math.PI * 2) * 0.022;
      P.torsoLean = Math.sin(t * Math.PI * 2 + 0.7) * 0.015;
      P.headTilt = Math.sin(t * Math.PI * 2 + 1.1) * 0.035;
      P.headY = Math.sin(t * Math.PI * 2) * 1.1;
      P.armPhase = Math.sin(t * Math.PI * 2) * 0.9;
      P.legPhase = 0;
      P.guard = 0.12 + Math.sin(t * Math.PI * 2) * 0.05;
      P.capeSway = Math.sin(t * Math.PI * 2 + 0.4) * 2.2;
      P.capeLift = 0.05;
    } else if (act === 'walk') {
      /* Ciclo de marcha: contacto → paso → contacto → paso */
      const ph = t * Math.PI * 2;
      P.legPhase = Math.sin(ph);
      P.armPhase = -Math.sin(ph) * 1.15; // brazos contrarios
      P.bob = Math.abs(Math.sin(ph)) * 9 - 3.5; // sube en el paso
      P.torsoTwist = Math.sin(ph) * 0.075; // rotación de hombros
      P.torsoLean = 0.05 + Math.sin(ph) * 0.02; // inclinación + balanceo de peso
      P.headTilt = -Math.sin(ph) * 0.03;
      P.headY = Math.abs(Math.sin(ph)) * 2.2;
      P.breath = Math.sin(ph * 0.5);
      P.guard = 0.18;
      P.capeSway = Math.sin(ph - 0.6) * 7;
      P.capeLift = 0.35 + Math.abs(Math.sin(ph)) * 0.18;
    } else if (act === 'melee') {
      /* 3 fases: carga (0–.30) · impacto (.30–.46) · recuperación (.46–1) */
      if (t < 0.3) {
        const k = eOutCubic(seg01(t, 0, 0.3));
        P.swing = -0.55 * k; // retrocede el arma
        P.torsoTwist = -0.16 * k;
        P.torsoLean = -0.05 * k;
        P.armPhase = -1.5 * k;
        P.bob = -2 * k;
        P.guard = 0.1;
      } else if (t < 0.46) {
        const k = eInCubic(seg01(t, 0.3, 0.46));
        P.swing = -0.55 + 2.05 * k; // latigazo
        P.torsoTwist = -0.16 + 0.42 * k;
        P.torsoLean = -0.05 + 0.16 * k;
        P.armPhase = -1.5 + 4.2 * k;
        P.thrust = k;
        P.bob = -2 + 7 * k;
        P.headTilt = 0.1 * k;
        P.guard = 0.1;
      } else {
        const k = eOutElastic(seg01(t, 0.46, 1));
        P.swing = 1.5 - 1.42 * k;
        P.torsoTwist = 0.26 - 0.26 * k;
        P.torsoLean = 0.11 - 0.11 * k;
        P.armPhase = 2.7 - 2.7 * k;
        P.thrust = 1 - k;
        P.bob = 5 - 5 * k;
        P.headTilt = 0.1 - 0.1 * k;
        P.guard = 0.1 + 0.08 * k;
      }
      P.breath = Math.sin(t * Math.PI * 2);
      P.capeSway = P.swing * 9;
      P.capeLift = 0.3 + Math.abs(P.swing) * 0.25;
    } else if (act === 'cast') {
      /* Acumulación (0–.62) · descarga (.62–.78) · asentar (.78–1) */
      if (t < 0.62) {
        const k = eOutCubic(seg01(t, 0, 0.62));
        P.castCharge = k;
        P.armPhase = 2.6 * k;
        P.torsoLean = -0.06 * k;
        P.bob = -3 * k + Math.sin(t * Math.PI * 14) * 0.9 * k; // vibración
        P.headTilt = -0.08 * k;
        P.headY = -2.5 * k;
        P.capeLift = 0.25 + 0.45 * k;
      } else if (t < 0.78) {
        const k = seg01(t, 0.62, 0.78);
        P.castCharge = 1 - k * 0.65;
        P.castBurst = Math.sin(k * Math.PI);
        P.armPhase = 2.6 + 1.5 * eInCubic(k);
        P.torsoLean = -0.06 + 0.18 * k;
        P.bob = -3 + 9 * k;
        P.headTilt = -0.08 + 0.16 * k;
        P.capeLift = 0.7 + 0.5 * Math.sin(k * Math.PI);
      } else {
        const k = eOutCubic(seg01(t, 0.78, 1));
        P.castCharge = 0.35 * (1 - k);
        P.castBurst = 0;
        P.armPhase = 4.1 - 4.1 * k;
        P.torsoLean = 0.12 - 0.12 * k;
        P.bob = 6 - 6 * k;
        P.headTilt = 0.08 - 0.08 * k;
        P.capeLift = 0.7 - 0.65 * k;
      }
      P.breath = Math.sin(t * Math.PI * 2);
      P.capeSway = Math.sin(t * Math.PI * 6) * 3.5;
    } else if (act === 'hurt') {
      /* Impulso brusco + decaimiento oscilante */
      const k = Math.pow(1 - t, 2.1);
      P.recoil = Math.sin(t * Math.PI * 7) * k;
      P.flash = Math.pow(1 - Math.min(1, t * 4), 2);
      P.torsoLean = -0.3 * k;
      P.torsoTwist = -0.18 * k;
      P.headTilt = -0.34 * k;
      P.headY = 3.5 * k;
      P.bob = -5 * k;
      P.armPhase = -2.2 * k;
      P.legPhase = 0.5 * k;
      P.guard = 0.05;
      P.capeSway = -12 * k;
      P.capeLift = 0.45 * k;
    } else if (act === 'death') {
      /* Impacto → tambaleo → derrumbe → asentamiento */
      if (t < 0.18) {
        // impacto
        const k = eOutCubic(seg01(t, 0, 0.18));
        P.recoil = Math.sin(k * Math.PI * 3) * (1 - k);
        P.flash = Math.pow(1 - k, 2);
        P.torsoLean = -0.34 * k;
        P.headTilt = -0.42 * k;
        P.bob = -6 * k;
        P.armPhase = -2.6 * k;
      } else if (t < 0.42) {
        // tambaleo, rodillas ceden
        const k = eInOut(seg01(t, 0.18, 0.42));
        P.torsoLean = -0.34 + 0.62 * k;
        P.headTilt = -0.42 + 0.3 * k;
        P.bob = -6 + 16 * k;
        P.sink = 10 * k;
        P.legPhase = Math.sin(k * Math.PI * 2) * 0.8;
        P.armPhase = -2.6 + 1.2 * k;
      } else if (t < 0.8) {
        // caída
        const k = eInCubic(seg01(t, 0.42, 0.8));
        P.fall = k;
        P.torsoLean = 0.28 + 0.3 * k;
        P.headTilt = -0.12 - 0.55 * k;
        P.sink = 10 + 38 * k;
        P.armPhase = -1.4 - 2.4 * k;
        P.legPhase = 0.8 - 1.6 * k;
        P.alpha = 1;
      } else {
        // asentamiento + desvanecer
        const k = eOutCubic(seg01(t, 0.8, 1));
        P.fall = 1 + 0.06 * Math.sin(k * Math.PI * 2) * (1 - k);
        P.torsoLean = 0.58;
        P.headTilt = -0.67;
        P.sink = 48 + 4 * k;
        P.armPhase = -3.8;
        P.legPhase = -0.8;
        P.alpha = 1 - 0.45 * k;
      }
      P.capeSway = P.fall * 16;
      P.capeLift = P.fall * 0.6;
    }
  }

  /* ══════════════════════════════════════════════════════════════════
   4 · UTILIDADES DE DIBUJO
   ══════════════════════════════════════════════════════════════════ */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function shade(hex, amt) {
    if (!hex || hex[0] !== '#') return hex;
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${clamp(((n >> 16) & 255) + amt, 0, 255)},${clamp(((n >> 8) & 255) + amt, 0, 255)},${clamp((n & 255) + amt, 0, 255)})`;
  }
  function ell(x, y, rx, ry, c, rot = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function seg(x1, y1, x2, y2, w, c, cap = 'round') {
    ctx.strokeStyle = c;
    ctx.lineWidth = w;
    ctx.lineCap = cap;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  function rr(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
  function poly(pts, fill, stroke, lw = 1.3) {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lw;
      ctx.stroke();
    }
  }

  /* ══════════════════════════════════════════════════════════════════
   5 · ARTE DE ARMAS — origen local (0,0) = CENTRO DE LA EMPUÑADURA
   Así el arma queda siempre anclada al centro de la mano.
   ══════════════════════════════════════════════════════════════════ */
  const O = 'rgba(20,14,11,.48)';
  function studs(pts, c, r = 1.9) {
    ctx.fillStyle = c;
    pts.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  function escamaFila(y, ancho, off, c, paso = 6.8, alto = 8.5) {
    for (let x = -ancho + off; x <= ancho - 3; x += paso) {
      ctx.beginPath();
      ctx.moveTo(x - 3.2, y);
      ctx.quadraticCurveTo(x, y + alto, x + 3.2, y);
      ctx.closePath();
      ctx.fillStyle = c;
      ctx.fill();
      ctx.strokeStyle = O;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }
  /* Bandas perpendiculares a un hueso: sirve para brazos y piernas. */
  function bandasHueso(a, b, ancho, n, c, grosor = 1.2) {
    const dx = b.x - a.x,
      dy = b.y - a.y,
      L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L,
      ny = dx / L;
    ctx.strokeStyle = c;
    ctx.lineWidth = grosor;
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1),
        px = a.x + dx * t,
        py = a.y + dy * t;
      ctx.beginPath();
      ctx.moveTo(px - nx * ancho, py - ny * ancho);
      ctx.lineTo(px + nx * ancho, py + ny * ancho);
      ctx.stroke();
    }
  }
  function tachasHueso(a, b, n, c, r = 1.8) {
    const pts = [];
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      pts.push([a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t]);
    }
    studs(pts, c, r);
  }
  /* Casco: corona común por dirección; cada set le agrega lo suyo. */
  function coronaCasco(dir, c, alto = 0, ancho = 0) {
    const top = RIG.headTop,
      cy = RIG.headCy,
      w = 16 + ancho,
      t = top - 7 - alto;
    if (dir === 'down')
      poly(
        [
          [-w, cy + 2],
          [-w, top + 2],
          [-9, t],
          [9, t],
          [w, top + 2],
          [w, cy + 2],
          [10, cy - 3],
          [-10, cy - 3],
        ],
        c,
        O,
        1.5,
      );
    else if (dir === 'up')
      poly(
        [
          [-w, cy + 6],
          [-w, top + 2],
          [-9, t],
          [9, t],
          [w, top + 2],
          [w, cy + 6],
          [0, cy + 10],
        ],
        c,
        O,
        1.5,
      );
    else
      poly(
        [
          [-w - 1, cy + 2],
          [-w, top + 1],
          [-6, t - 1],
          [9, top - 3],
          [w - 1, cy - 1],
          [9, cy - 4],
          [-11, cy - 4],
        ],
        c,
        O,
        1.5,
      );
  }

  const SETS = {
    /* ─────────────── METAL 1 · Placas del Norte ─────────────── */
    placas: {
      nombre: 'Placas del Norte',
      familia: 'metal',
      limb: (b, f) => shade(b.armor, f ? -4 : -16),
      hand: b => shade(b.armor, -18),
      torso(b) {
        const c = b.armor,
          hi = shade(c, 20),
          dk = shade(c, -20);
        poly(
          [
            [-10, RIG.neckBot - 2],
            [-26, -84],
            [-32, RIG.shoulderY + 16],
            [-30, RIG.chestY],
            [-24, RIG.waistY],
            [-21, 6],
            [21, 6],
            [24, RIG.waistY],
            [30, RIG.chestY],
            [32, RIG.shoulderY + 16],
            [26, -84],
            [10, RIG.neckBot - 2],
          ],
          c,
          O,
          1.6,
        );
        seg(0, -84, 0, 4, 2.4, hi);
        seg(2.5, -84, 2.5, 4, 1, 'rgba(0,0,0,.3)');
        [-62, -44, -26].forEach(y => seg(-28, y, 28, y, 1.4, dk));
        for (let i = 0; i < 3; i++) rr(-22 + i * 1.5, 8 + i * 8, 44 - i * 3, 11, 2, shade(c, -8 - i * 4), O);
        studs(
          [
            [-23, -64],
            [23, -64],
            [-25, -46],
            [25, -46],
            [-25, -28],
            [25, -28],
          ],
          hi,
        );
      },
      pauldron(s, b) {
        const c = b.armor;
        for (let i = 0; i < 3; i++)
          poly(
            [
              [-11 * s, -6 + i * 7],
              [12 * s, -9 + i * 7],
              [13 * s, 1 + i * 7],
              [-10 * s, 4 + i * 7],
            ],
            shade(c, -i * 9),
            O,
            1.3,
          );
        studs([[8 * s, -4]], shade(c, 20), 2);
      },
      helmet(dir, b) {
        const c = b.armor,
          hi = shade(c, 22),
          dk = shade(c, -14),
          top = RIG.headTop,
          cy = RIG.headCy;
        coronaCasco(dir, c);
        if (dir === 'down') {
          seg(0, top - 6, 0, cy - 2, 2.4, hi);
          seg(-16, cy - 1, 16, cy - 1, 1.6, dk);
          poly(
            [
              [-16, cy - 1],
              [-10, cy - 1],
              [-9, cy + 13],
              [-15, cy + 10],
            ],
            shade(c, -12),
            O,
            1.2,
          );
          poly(
            [
              [16, cy - 1],
              [10, cy - 1],
              [9, cy + 13],
              [15, cy + 10],
            ],
            shade(c, -12),
            O,
            1.2,
          );
          poly(
            [
              [-2.6, cy - 2],
              [2.6, cy - 2],
              [2.1, cy + 9],
              [-2.1, cy + 9],
            ],
            shade(c, -4),
            O,
            1.1,
          );
        } else if (dir === 'up') {
          seg(0, top - 6, 0, cy + 8, 2.4, hi);
          seg(-15, cy - 4, 15, cy - 4, 1.6, dk);
          studs(
            [
              [-9, cy - 8],
              [9, cy - 8],
              [0, top + 6],
            ],
            hi,
          );
        } else {
          seg(-6, top - 6, -13, cy - 3, 2.2, hi);
          poly(
            [
              [-16, cy - 2],
              [-9, cy - 2],
              [-8, cy + 12],
              [-15, cy + 9],
            ],
            shade(c, -12),
            O,
            1.2,
          );
          poly(
            [
              [9, cy - 3],
              [14, cy - 1],
              [13, cy + 7],
              [8, cy + 6],
            ],
            shade(c, -6),
            O,
            1.1,
          );
          seg(-16, cy - 1, 14, cy - 2, 1.5, dk);
        }
      },
      neck(b) {
        poly(
          [
            [-13, RIG.neckBot + 2],
            [-11, RIG.neckTop + 1],
            [11, RIG.neckTop + 1],
            [13, RIG.neckBot + 2],
            [9, RIG.neckBot + 5],
            [-9, RIG.neckBot + 5],
          ],
          shade(b.armor, -10),
          O,
          1.4,
        );
        studs(
          [
            [-8, RIG.neckBot],
            [8, RIG.neckBot],
          ],
          shade(b.armor, 20),
          1.5,
        );
      },
      armPlate(sh, el, hd, f, b) {
        const c = b.armor;
        ctx.save();
        ctx.lineCap = 'butt';
        ctx.strokeStyle = f ? shade(c, -4) : shade(c, -16);
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(sh.x, sh.y + 3);
        ctx.lineTo(el.x, el.y - 4);
        ctx.stroke();
        ctx.strokeStyle = shade(c, -10);
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(el.x, el.y + 4);
        ctx.lineTo(hd.x, hd.y - 4);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = shade(c, -2);
        ctx.strokeStyle = O;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(el.x, el.y, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      },
      glove(hd, f, b) {
        ell(hd.x, hd.y, 5.6, 5.6, shade(b.armor, -18));
        studs([[hd.x, hd.y - 1]], shade(b.armor, 8), 1.6);
      },
      legPlate(hip, knee, foot, f, b) {
        const c = b.armor;
        ctx.save();
        ctx.lineCap = 'butt';
        ctx.strokeStyle = shade(c, -8);
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.moveTo(hip.x, hip.y + 2);
        ctx.lineTo(knee.x, knee.y - 6);
        ctx.stroke();
        ctx.strokeStyle = shade(c, -16);
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(knee.x, knee.y + 6);
        ctx.lineTo(foot.x, foot.y - 4);
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = shade(c, -4);
        ctx.strokeStyle = O;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(knee.x, knee.y, 8, 0, Math.PI * 2);

  /* ── Piezas comunes, con estilo por familia ── */
  function cuero(x1, y1, x2, y2, w, c) {
    seg(x1, y1, x2, y2, w, c, 'butt');
  }
  function cordel(y0, y1, c, paso = 3.4) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.5;
    for (let y = y0; y < y1; y += paso) {
      ctx.beginPath();
      ctx.moveTo(-3.4, y);
      ctx.lineTo(3.4, y + 1.6);
      ctx.stroke();
    }
  }
  function estrias(y0, y1, c, paso = 4) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.8;
    for (let y = y0; y < y1; y += paso) {
      ctx.beginPath();
      ctx.moveTo(-3.2, y);
      ctx.lineTo(3.2, y);
      ctx.stroke();
    }
  }
  /* Ondas del acero valyrio: una linea sinuosa a lo largo de la hoja. */
  function ondas(largo, ancho, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) {
      const t = i / 10,
        y = -largo * t,
        x = Math.sin(t * 7.2) * ancho * 0.34;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  /* Mellas del acero de los Fosos: muescas en un borde. */
  function mellas(largo, ancho, c, n = 4) {
    ctx.fillStyle = c;
    for (let i = 0; i < n; i++) {
      const y = -largo * (0.28 + i * 0.16);
      ctx.beginPath();
      ctx.moveTo(ancho / 2, y);
      ctx.lineTo(ancho / 2 + 2.6, y - 2.2);
      ctx.lineTo(ancho / 2, y - 4.4);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* Ancla universal: dibuja el arma con su empuñadura en (hx,hy). */
  function drawWeaponAt(id, hx, hy, angle) {
    if (!id || id === 'none') return;
    const fam = ARMA();
    const dibujo = fam[id] || ART[id];
    if (!dibujo) return;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(angle);
    dibujo.call(fam);
    ctx.restore();
  }

  /* ══════════════════════════════════════════════════════════════════
   6 · ÁNGULOS DE ARMA POR DIRECCIÓN Y CLIP
   ══════════════════════════════════════════════════════════════════ */
  function weaponAngle(dir, id) {
    const m = MAIN[id] || OFF[id] || {};
    const stab = m.arc === 'stab';
    const base =
      dir === 'down' ? (stab ? 0.1 : 0.3) : dir === 'up' ? (stab ? 2.24 : 2.36) : stab ? 0.92 : 1.06;
    const sw = P.swing * (stab ? 0.55 : 1.05) + P.thrust * (stab ? 0.3 : 0.18);
    return dir === 'up' ? base - sw : base + sw;
  }

              [-13, top - 1],
              [0, top - 7],
              [11, top + 1],
              [9, top + 9],
              [-2, top + 6],
              [-8, top + 13],
            ],
            c,
            dk,
            1.2,
          );
          if (state.hair === 'ponytail') {
            seg(-13, top + 12, -19, -74, 6, c);
            ell(-20, -66, 6, 9, c);
          }
          if (state.hair === 'bun') ell(-9, top - 4, 7, 7, c);
        }
      }
      ctx.restore();
    }
    drawHelmet(dir, base);
    ctx.restore();
  }

  /* ── EXTREMIDADES ── */
  function armColors(base, front) {
    const S = SET();
    return {
      limb: eqOn('arms')
        ? S.limb(base, front)
        : clothOn('arms')
          ? shade(base.shirt, front ? 8 : -12)
          : shade(base.skin, front ? 6 : -6),
      hand: eqOn('gloves')
        ? S.hand(base, front)
        : clothOn('gloves')
          ? shade(base.shirt, -18)
          : shade(base.skin, front ? 10 : -12),
    };
  }
  function drawArm(shoulder, elbow, hand, front, base) {
    const c = armColors(base, front);
    seg(shoulder.x, shoulder.y, elbow.x, elbow.y, 11, c.limb);
    seg(elbow.x, elbow.y, hand.x, hand.y, 9.5, c.hand);
    if (eqOn('arms')) SET().armPlate(shoulder, elbow, hand, front, base);
    if (eqOn('gloves')) SET().glove(hand, front, base);
    else ell(hand.x, hand.y, 5.2, 5.2, c.hand);
    return { x: hand.x, y: hand.y };
  }
  /* Devuelve el joint de la mano; el arma se ancla exactamente ahí. */
  function armPose(side, dir, weaponArm) {
    const s = side === 'left' ? -1 : 1;
    const up = dir === 'up';
    const sw = (weaponArm ? P.armPhase : -P.armPhase * 0.55) * s * (up ? -1 : 1);
    const two = usesTwoHandGrip() && weaponArm;
    const cast = P.castCharge * (weaponArm ? 1 : 0.55);
    const sh = { x: s * RIG.shoulderX, y: RIG.shoulderY + 8 };
    const el = { x: s * (RIG.shoulderX + 7) + sw * 2.6 * s, y: RIG.elbowY + sw * 3.0 - cast * 22 };
    const hd = {
      x: s * (RIG.shoulderX + 12) + sw * 4.4 * s - (two ? s * 10 : 0),
      y: RIG.handY + sw * 5.0 - cast * 46 - (two ? 8 : 0),
    };
    return { sh, el, hd };
  }
  function drawLeg(xF, front, base, dir) {
    const ph = P.legPhase * (front ? 1 : -1) * 8.5;
    // La elevación real del pie es una parábola sobre la posición relativa a
    // la cadera: máxima cuando la pierna pasa bajo el cuerpo (swingNorm≈0) y
    // cero en los extremos, que es justo cuando el pie toca el suelo.
    const swingNorm = ph / 8.5;
    const lift = (1 - swingNorm * swingNorm) * 4.4;
    const skin = front ? shade(base.skin, 6) : shade(base.skin, -8);
    const cl = front ? shade(base.pants, 10) : shade(base.pants, -12);
    const col = eqOn('legs')
      ? front
        ? shade(base.armor, -2)
        : shade(base.armor, -16)
      : clothOn('pants')
        ? cl
        : skin;
    const hip = { x: xF, y: RIG.hipY + P.sink * 0.25 };
    // La separación base (±9) y el coeficiente de zancada (0.85) están
    // calculados para que, en el peor caso (piernas en extremos opuestos),
    // la pierna de atrás nunca alcance ni cruce a la de adelante:
    // 9*2 - 0.85*8.5*2 ≈ +3.6px de margen siempre a favor.
    const knee = { x: xF + (front ? 5 : -5) + ph * 0.45, y: RIG.kneeY + ph * 0.4 - lift * 0.5 + P.sink * 0.5 };
    const foot = { x: xF + (front ? 9 : -9) + ph * 0.85, y: RIG.footY - lift + P.sink * 0.2 };
    seg(hip.x, hip.y, knee.x, knee.y, 13, col);
    seg(knee.x, knee.y, foot.x, foot.y, 10, col);
    if (eqOn('legs')) SET().legPlate(hip, knee, foot, front, base);
    if (eqOn('boots')) SET().boot(knee, foot, base);
    ell(foot.x, foot.y + 7, 11.5, 5, eqOn('boots') ? SET().sole(base) : '#2e241d');
  }
  function drawTunic(base, dir) {
    if (!state.showTunic) return;
    TUN().draw(base, dir);
  }
  function drawCape(base, dir) {
    if (!state.showCape) return;
    ctx.save();
    CAP().draw(base, dir);
    ctx.restore();
  }
  function drawCapeCollar(base, dir) {
    if (!state.showCape) return;
    CAP().collar(base, dir);
  }
  /* La capucha va sobre la cabeza, asi que se dibuja al final. */
  function drawCapeHood(base, dir) {
    if (!state.showCape) return;
    const c = CAP();
    if (c.hood) c.hood(base, dir);
  }
  function fxSlash(x, y, rot) {
    if (P.thrust <= 0.02) return;
    const a = P.thrust;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.strokeStyle = `rgba(255,238,190,${0.45 * a})`;
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(0, 0, 66, -1.55, -0.02);
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,225,${0.3 * a})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, 0, 74, -1.7, -0.1);
    ctx.stroke();
    ctx.restore();
  }
  function fxMagic(x, y) {
    const c = P.castCharge,
      b = P.castBurst;
    if (c <= 0.01 && b <= 0.01) return;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2 + clipT * 3.2,
        r = (16 + c * 14) * (1 - b * 0.4) + b * 46;
      ell(
        x + Math.cos(a) * r,
        y + Math.sin(a) * r,
        3.2 + c * 2 + b * 2,
        3.2 + c * 2 + b * 2,
        `rgba(140,185,255,${0.3 + c * 0.4})`,
      );
    }
    ell(x, y, 10 + c * 18 + b * 40, 10 + c * 18 + b * 40, `rgba(120,170,255,${0.12 + c * 0.2 + b * 0.28})`);
    if (b > 0.01) {
      ctx.strokeStyle = `rgba(200,225,255,${b * 0.6})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, 30 + b * 58, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  function fxHurt() {
    if (P.flash <= 0.01) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(210,60,50,${P.flash * 0.42})`;
    ctx.fillRect(-60, RIG.headTop - 20, 120, 300);
    ctx.restore();
    for (let i = 0; i < 6; i++) {
      const a = -0.6 - i * 0.42,
        d = (1 - P.flash) * 40 + 10;
      ell(
        Math.cos(a) * d,
        RIG.chestY + Math.sin(a) * d,
        3.4 * P.flash + 1,
        3.4 * P.flash + 1,
        `rgba(168,40,36,${P.flash * 0.8})`,
      );
    }
  }

  /* ══════════════════════════════════════════════════════════════════
   8 · COMPOSICIÓN POR DIRECCIÓN
   Jerarquías recuperadas de index(37):
   · Abajo: capa y pelo trasero quedan detrás del cuerpo.
   · Arriba: la capa cruza por delante del cuerpo y las extremidades.
   · Laterales: capa y melena forman la silueta posterior.
   El cuello/broche de la capa se separa del paño para poder quedar al frente.
   ══════════════════════════════════════════════════════════════════ */
  function offHandItem() {
    return state.off === 'none' ? null : state.off;
  }
  function mainHandItem() {
    return state.main === 'none' ? null : state.main;
  }

  function composeDown(base) {
    /* Fondo: la capa y todo el cabello posterior quedan detrás del cuerpo. */
    drawCape(base, 'down');
    backHair(base);
    longHair(base, 'down');
    drawLeg(-11, false, base, 'down');
    drawLeg(11, true, base, 'down');
    const L = armPose('left', 'down', false);
    drawArm(L.sh, L.el, L.hd, false, base);
    drawPauldron(L.sh.x, L.sh.y - 4, 'left', base);
    drawBody(base);
    drawNeck(base);
    drawTorsoArmor(base);
    drawTunic(base, 'down');
    /* El broche pertenece al frente aunque el paño de la capa quede atrás. */
    drawCapeCollar(base, 'down');
    /* mano secundaria */
    if (hasShield()) drawWeaponAt('shield', L.hd.x, L.hd.y, 0);
    else if (hasSpellbook()) drawWeaponAt('spellbook', L.hd.x, L.hd.y, 0.12);
    else if (isDualWield()) drawWeaponAt(state.off, L.hd.x, L.hd.y, -0.34 - P.swing * 0.5);
    /* mano principal */
    const R = armPose('right', 'down', true);
    drawArm(R.sh, R.el, R.hd, true, base);
    drawPauldron(R.sh.x, R.sh.y - 4, 'right', base);
    const m = mainHandItem();
    if (m) {
      const ang = m === 'bow' ? Math.PI / 2 : weaponAngle('down', m);
      drawWeaponAt(m, R.hd.x, R.hd.y, ang);
      if (MAIN[m].arc === 'slash' || MAIN[m].arc === 'stab') fxSlash(R.hd.x + 24, R.hd.y - 56, -0.56);
      if (m === 'staff') fxMagic(R.hd.x + Math.sin(ang) * 118, R.hd.y - Math.cos(ang) * 118);
    }
    if (hasSpellbook() && !m) fxMagic(L.hd.x, L.hd.y - 6);
    drawHead('down', base);
  }
  function composeUp(base) {
    /* En la vista posterior, escudo y brazo secundario parten al fondo. */
    const L = armPose('left', 'up', false);
    if (hasShield()) drawWeaponAt('shield', L.hd.x, L.hd.y, 0);
    drawArm(L.sh, L.el, L.hd, false, base);
    drawPauldron(L.sh.x, L.sh.y - 4, 'left', base);
    drawLeg(-11, false, base, 'up');
    drawLeg(11, true, base, 'up');
    drawBody(base);
    drawNeck(base);
    drawTorsoArmor(base);
    drawTunic(base, 'up');
    if (hasSpellbook()) drawWeaponAt('spellbook', L.hd.x, L.hd.y, -0.12);
    else if (isDualWield()) drawWeaponAt(state.off, L.hd.x, L.hd.y, 3.5 + P.swing * 0.4);
    const R = armPose('right', 'up', true);
    drawArm(R.sh, R.el, R.hd, true, base);
    drawPauldron(R.sh.x, R.sh.y - 4, 'right', base);
    const m = mainHandItem();
    if (m) {
      const ang = m === 'bow' ? Math.PI / 2 : weaponAngle('up', m);
      drawWeaponAt(m, R.hd.x, R.hd.y, ang);
      if (MAIN[m].arc === 'slash' || MAIN[m].arc === 'stab') fxSlash(R.hd.x + 24, R.hd.y - 48, 2.34);
      if (m === 'staff') fxMagic(R.hd.x + Math.sin(ang) * 118, R.hd.y - Math.cos(ang) * 118);
    }
    /* Hacia arriba, la capa sí cruza por delante del cuerpo y las armas. */
    drawCape(base, 'up');
    drawCapeCollar(base, 'up');
    longHair(base, 'up');
    drawHead('up', base);
  }
  function composeSide(base, dir) {
    const flip = dir === 'left';
    ctx.save();
    if (flip) ctx.scale(-1, 1);
    /* La silueta posterior se establece antes que cuerpo y extremidades. */
    drawCape(base, dir);
    longHair(base, 'right');
    /* Escudo al fondo en ambos perfiles. */
    if (hasShield()) drawWeaponAt('shield', 16, -14, 0);
    /* brazo trasero */
    const rearLimb = eqOn('arms')
      ? shade(base.armor, -16)
      : clothOn('arms')
        ? shade(base.shirt, -12)
        : shade(base.skin, -8);
    const rearHand = eqOn('gloves')
      ? shade(base.armor, -18)
      : clothOn('gloves')
        ? shade(base.shirt, -18)
        : shade(base.skin, -12);
    const rs = P.armPhase * -1;
    seg(2, RIG.shoulderY + 8, 15, RIG.elbowY + rs * 2.2, 10, rearLimb);
    seg(15, RIG.elbowY + rs * 2.2, 22, RIG.handY + rs * 3.4, 9, rearHand);
    ell(22, RIG.handY + rs * 3.4, 5.2, 5.2, rearHand);
    if (isDualWield()) drawWeaponAt(state.off, 22, RIG.handY + rs * 3.4, -0.86 - P.swing * 0.4);
    /* pierna trasera */
    drawLeg(4, false, base, dir);
    drawBody(base, true);
    drawPauldron(2, RIG.shoulderY + 4, 'right', base);
    /* pierna delantera */
    drawLeg(-6, true, base, dir);
    drawNeck(base);
    drawTorsoArmor(base);
    drawTunic(base, dir);
    drawCapeCollar(base, dir);
    /* brazo delantero + arma */
    const fLimb = eqOn('arms')
      ? shade(base.armor, -4)
      : clothOn('arms')
        ? shade(base.shirt, 8)
        : shade(base.skin, 6);
    const fs = P.armPhase,
      cast = P.castCharge;
    const el = { x: -3 + fs * 3.2, y: RIG.elbowY + fs * 2.4 - cast * 20 };
    const hd = { x: 14 + fs * 6.4, y: RIG.handY + fs * 4.2 - cast * 44 };
    const frontHand = eqOn('gloves')
      ? shade(base.armor, -18)
      : clothOn('gloves')
        ? shade(base.shirt, -18)
        : shade(base.skin, 10);
    seg(-3, RIG.shoulderY + 8, el.x, el.y, 10, fLimb);
    seg(el.x, el.y, hd.x, hd.y, 9, frontHand);
    ell(hd.x, hd.y, 5.2, 5.2, frontHand);
    if (hasSpellbook()) drawWeaponAt('spellbook', hd.x, hd.y, 0.1);
    const m = mainHandItem();
    if (m) {
      const ang = m === 'bow' ? Math.PI / 2 : weaponAngle('side', m);
      drawWeaponAt(m, hd.x, hd.y, ang);
      if (MAIN[m].arc === 'slash' || MAIN[m].arc === 'stab') fxSlash(hd.x + 20, hd.y - 40, 0.9);
      if (m === 'staff') fxMagic(hd.x + Math.sin(ang) * 118, hd.y - Math.cos(ang) * 118);
    }
    if (hasSpellbook() && !m) fxMagic(hd.x, hd.y);
    ctx.restore();
    drawHead(dir, base);
  }

  function drawHuman(base) {
    ctx.save();
    ctx.globalAlpha = P.alpha;
    ctx.translate(0, -P.bob + P.sink);
    ctx.rotate(P.fall * (Math.PI / 2) * 0.92 + P.torsoLean * 0.35 + P.recoil * 0.05);
    ctx.translate(P.recoil * 3, 0);
    ctx.scale(0.92, 0.92);
    ctx.save();
    ctx.rotate(P.torsoTwist * 0.5);
    if (state.dir === 'down') composeDown(base);
    else if (state.dir === 'up') composeUp(base);
    else composeSide(base, state.dir);
    ctx.restore();
    fxHurt();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function parseHands(v) {
    if (v.main || v.off) {
      return { main: v.main || 'none', off: v.off || 'none' };
    }
    const weapon = v.weapon || 'none';
    const composite = {
      swordShield: ['sword', 'shield'],
      daggerShield: ['dagger', 'shield'],
      maceShield: ['mace', 'shield'],
      spearShield: ['spear', 'shield'],
      spellbookStaff: ['staff', 'spellbook'],
      shieldOnly: ['none', 'shield'],
      spellbook: ['none', 'spellbook'],
    };
    if (composite[weapon]) return { main: composite[weapon][0], off: composite[weapon][1] };
    return { main: weapon, off: v.shield ? 'shield' : 'none' };
  }

  function applyVisual(v) {
    const hands = parseHands(v);
    state.tab = 'humans';
    state.dir = v.dir || 'down';
    state.main = MAIN[hands.main] ? hands.main : 'none';
    state.off = OFF[hands.off] ? hands.off : 'none';
    state.hair = v.hair || 'short';
    state.weaponColor = v.weaponColor || '#c2c9ce';
    state.shieldColor = v.shieldColor || '#756a5e';
    state.armorSet = SETS[v.armorSet] ? v.armorSet : 'placas';
    state.tunicSet = TUNICS[v.tunicSet] ? v.tunicSet : 'maestre';
    state.capeSet = CAPES[v.capeSet] ? v.capeSet : 'invierno';
    state.weaponSet = ARMAS[v.weaponSet] ? v.weaponSet : 'norte';
    state.showClothes = v.showClothes !== false;
    state.clothes = {
      head: !!v.clothes?.head,
      neck: !!v.clothes?.neck,
      shirt: v.clothes?.shirt !== false,
      arms: v.clothes?.arms !== false,
      gloves: !!v.clothes?.gloves,
      pants: v.clothes?.pants !== false,
      boots: !!v.clothes?.boots,
    };
    state.showCape = !!v.cape;
    state.showTunic = !!v.tunic;
    state.equip = {
      helmet: !!v.equip?.helmet,
      neck: !!v.equip?.neck,
      torso: !!v.equip?.torso,
      arms: !!v.equip?.arms,
      gloves: !!v.equip?.gloves,
      legs: !!v.equip?.legs,
      boots: !!v.equip?.boots,
    };

    let action = v.action || 'idle';
    // El adaptador manda 'attack' para las bestias, pero el clip se llama
    // 'melee'. Sin esta linea la criatura caia a idle y no atacaba nunca.
    if (action === 'attack') action = 'melee';
    if (v.dying) action = 'death';
    else if ((v.hit || 0) > 0.001) action = 'hurt';
    state.action = CLIPS[action] ? action : 'idle';

    const clip = CLIPS[state.action];
    if (state.action === 'melee') clipT = clamp(v.attackProgress || 0, 0, 1) * clip.dur;
    else if (state.action === 'cast') clipT = clamp(v.castProgress || 0, 0, 1) * clip.dur;
    else if (state.action === 'hurt') clipT = (1 - clamp(v.hit || 0, 0, 1)) * clip.dur;
    else if (state.action === 'death') clipT = clamp(v.death || 0, 0, 1) * clip.dur;
    else {
      const actorTime = Number.isFinite(v.time) ? Math.max(0, v.time) : performance.now() / 1000;
      clipT = actorTime % clip.dur;
    }
    clipDone = false;
    updateAnim(0);
  }

  /* ── Helpers de anatomía ── */
  function pata2(a, b, c, w1, w2, col, garra) {
    seg(a.x, a.y, b.x, b.y, w1, col);
    seg(b.x, b.y, c.x, c.y, w2, shade(col, -8));
    if (garra) {
      ctx.fillStyle = garra;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(c.x + i * 3, c.y);
        ctx.lineTo(c.x + i * 3 + 2.5, c.y + 7);
        ctx.lineTo(c.x + i * 3 - 1, c.y + 6);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
  function colaSeg(x, y, n, largo, grosor, col, curva) {
    let px = x,
      py = y;
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / n;
      const nx = px - largo / n,
        ny = py + Math.sin(t * 2.4 + curva * 0.12) * curva * 0.5 - t * 4;
      seg(px, py, nx, ny, grosor * (1 - t * 0.72), col);
      px = nx;
      py = ny;
    }
    return { x: px, y: py };
  }
  function alaMembrana(x, y, esc, hueso, memb, abre) {
    ctx.save();
    ctx.translate(x, y);
    const a = 0.35 + abre * 0.85;
    const p = [
      [0, 0],
      [-52 * esc * Math.cos(a), -46 * esc * Math.sin(a) - 14 * esc],
      [-88 * esc, -18 * esc - abre * 22 * esc],
      [-72 * esc, 26 * esc],
      [-34 * esc, 30 * esc],
    ];
    poly(p, memb, shade(memb, -30), 1.6);
    ctx.strokeStyle = hueso;
    ctx.lineWidth = 3.4 * esc;
    [1, 2, 3].forEach(i => {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(p[i][0], p[i][1]);
      ctx.stroke();
    });
    ctx.lineWidth = 2 * esc;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(p[4][0], p[4][1]);
    ctx.stroke();
    ctx.restore();
  }
  function craneoM(x, y, r, col, ojo, brillo) {
    ell(x, y, r, r * 1.12, col);
    poly(
      [
        [x - r * 0.5, y + r * 0.5],
        [x + r * 0.5, y + r * 0.5],
        [x + r * 0.34, y + r * 1.05],
        [x - r * 0.34, y + r * 1.05],
      ],
      shade(col, -8),
    );
    const s = r * 0.42;
    ell(x - s, y - r * 0.1, r * 0.28, r * 0.32, '#100c0a');
    ell(x + s, y - r * 0.1, r * 0.28, r * 0.32, '#100c0a');
    if (brillo > 0) {
      ell(x - s, y - r * 0.1, r * 0.2, r * 0.22, ojo);
      ell(x + s, y - r * 0.1, r * 0.2, r * 0.22, ojo);
      ell(x - s, y - r * 0.1, r * 0.42, r * 0.44, `rgba(${brillo})`);
      ell(x + s, y - r * 0.1, r * 0.42, r * 0.44, `rgba(${brillo})`);
    }
    ctx.strokeStyle = shade(col, -24);
    ctx.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * r * 0.3, y + r * 0.5);
      ctx.lineTo(x + i * r * 0.26, y + r * 1.02);
      ctx.stroke();
    }
  }
  function costillas(x, y, w, h, n, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 3.2;
    seg(x, y, x, y + h, 4.2, shade(col, -6));
    for (let i = 0; i < n; i++) {
      const yy = y + 4 + (i * (h - 6)) / n,
        ww = w * (1 - Math.abs(i - n / 2.4) / (n * 1.5));
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.quadraticCurveTo(x - ww, yy + 3, x - ww * 0.72, yy + 9);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.quadraticCurveTo(x + ww, yy + 3, x + ww * 0.72, yy + 9);
      ctx.stroke();
    }
  }
  function harapos(x, y, w, h, col, sway, n = 6) {
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1),
        px = x - w + 2 * w * t;
      const largo = h * (0.62 + 0.38 * Math.abs(Math.sin(i * 1.7)));
      ctx.beginPath();
      ctx.moveTo(px - w / n, y);
      ctx.lineTo(px + w / n, y);
      ctx.lineTo(px + (w / n) * 0.5 + sway * t, y + largo);
      ctx.lineTo(px - (w / n) * 0.5 + sway * t, y + largo * 0.86);
      ctx.closePath();
      ctx.fill();
    }
  }
  function bruma(x, y, r, col, t, n = 5) {
    for (let i = 0; i < n; i++) {
      const a = t * 0.9 + i * 1.26;
      ell(
        x + Math.cos(a) * r * 0.5,
        y + Math.sin(a * 0.7) * r * 0.3 + i * 3,
        r * (0.66 - i * 0.09),
        r * (0.4 - i * 0.05),
        col,
      );
    }
  }
  function ojosBrillo(x, y, sep, r, col, halo) {
    ell(x - sep, y, r * 2.1, r * 2.1, halo);
    ell(x + sep, y, r * 2.1, r * 2.1, halo);
    ell(x - sep, y, r, r, col);
    ell(x + sep, y, r, r, col);
  }

  /* ── Marcha según el plan corporal ── */
  function marcha(plan) {
    const w = P.legPhase,
      base = {
        th: P.thrust,
        br: P.breath,
        bob: P.bob,
        cast: P.castCharge,
        t: clipT,
        resp: 1 + P.breath * 0.022,
      };
    if (plan === 'quad' || plan === 'dragon')
      return {
        ...base,
        patas: [w, -w, -w, w],
        pitch: w * 0.03,
        cuello: -w * 3.2,
        cola: Math.sin(clipT * 4.2) * 9 + w * 7,
        cabeza: -Math.abs(w) * 2,
      };
    if (plan === 'flota')
      return {
        ...base,
        patas: [],
        flote: Math.sin(clipT * 1.9) * 5.5,
        harapo: Math.sin(clipT * 2.3) * 8 + w * 6,
        cola: 0,
        cabeza: Math.sin(clipT * 1.6) * 1.6,
      };
    // Las piernas salen de legPhase, pero los brazos de armPhase: asi se mueven
    // tambien al respirar en idle y al cargar el golpe, no solo al caminar.
    const a = P.armPhase;
    if (plan === 'aracnido')
      return { ...base, patas: [w, -w, w * 0.6, -w * 0.6], pitch: 0, cola: 0, cabeza: -Math.abs(w) * 1.2 };
    return {
      ...base,
      patas: [w, -w],
      brazos: [-a * 0.5, a * 0.5],
      lean: P.torsoLean,
      cola: w * 5,
      cabeza: -Math.abs(w) * 1.8 - P.headY * 0.4,
    };
  }

        ojo: '#d88030',
        halo: 'rgba(216,128,48,.2)',
        cerda: '#2e2118',
        marfil: '#e8e0c8',
      },
      draw(A, c) {
        const dk = c.dk;
        const P4 = [
          [-32, 22],
          [-12, 26],
          [20, 26],
          [38, 22],
        ];
        P4.forEach(([x, y], i) => {
          const o = A.patas[i] * 9;
          pata2(
            { x, y },
            { x: x + o * 0.3, y: y + 26 },
            { x: x + o * 0.55, y: y + 48 },
            10,
            8,
            dk,
            '#cfc7ae',
          );
        });
        colaSeg(-38, 2, 3, 20, 7, dk, A.cola * 0.5);
        ctx.save();
        ctx.scale(1, A.resp);
        // cuerpo en cuna: alto en los hombros, bajo en la cadera
        ctx.fillStyle = c.body;
        ctx.beginPath();
        ctx.moveTo(-40, 4);
        ctx.quadraticCurveTo(-24, -26, 6, -30);
        ctx.quadraticCurveTo(34, -32, 44, -8);
        ctx.lineTo(42, 24);
        ctx.lineTo(-38, 26);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.26)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        rr(-30, 6, 66, 18, 8, c.belly, 'rgba(0,0,0,.12)');
        // cerda erizada del lomo
        ctx.strokeStyle = c.cerda;
        ctx.lineWidth = 2.2;
        for (let x = -30; x < 32; x += 7) {
          ctx.beginPath();
          ctx.moveTo(x, -28);
          ctx.lineTo(x + 2, -42 - Math.abs(A.patas[0]) * 3);
          ctx.stroke();
        }
        ctx.restore();
        // cabeza baja, hocico largo
        const hx = 54 + A.th * 22,
          hy = 2 + A.cuello * 0.5 + A.cabeza;
        seg(38, -8, hx - 6, hy - 4, 26, c.body);
        ell(hx, hy, 19, 16, c.body);
        poly(
          [
            [hx + 10, hy - 4],
            [hx + 34 + A.th * 10, hy + 4],
            [hx + 10, hy + 10],
          ],
          shade(c.body, 6),
          'rgba(0,0,0,.2)',
          1.3,
        );
        ell(hx + 32 + A.th * 10, hy + 4, 4, 3.4, '#2a1e16');
        // colmillos curvos hacia arriba: la marca del jabali
        ctx.fillStyle = c.marfil;
        [1, -1].forEach(s => {
          ctx.beginPath();
          ctx.moveTo(hx + 24, hy + 6 + s * 2);
          ctx.quadraticCurveTo(hx + 34, hy - 4 + s * 3, hx + 30, hy - 14 + s * 2);
          ctx.quadraticCurveTo(hx + 27, hy - 4 + s * 3, hx + 22, hy + 6 + s * 2);
          ctx.closePath();
          ctx.fill();
        });
        // orejas cortas
        poly(
          [
            [hx - 10, hy - 12],
            [hx - 14, hy - 26],
            [hx - 2, hy - 14],
          ],
          dk,
        );
        ojosBrillo(hx + 6, hy - 6, 6, 2.2, c.ojo, c.halo);
        if (A.th > 0.06) ell(hx + 22, hy + 8, 7 + A.th * 4, 4 + A.th * 3, '#3a1a18');
      },
    },

    spider: {
      nombre: 'Araña Umbría',
      desc: 'Ocho patas y ninguna prisa. Teje donde no llega la luz.',
      plan: 'aracnido',
      col: {
        body: '#2e2438',
        belly: '#3e3450',
        dk: '#1e1826',
        ojo: '#c85898',
        halo: 'rgba(200,88,152,.26)',
        pelo: '#4a3c5c',
        quelicero: '#d8c8a0',
      },
      draw(A, c) {
        const dk = c.dk;
        // ocho patas: cuatro por lado, en dos grupos que alternan
        for (let lado = -1; lado <= 1; lado += 2) {
          for (let i = 0; i < 4; i++) {
            const fase = A.patas[(i + (lado < 0 ? 2 : 0)) % 4] || 0;
            const bx = -14 + i * 11,
              by = -6;
            const rodilla = { x: bx + lado * (26 + i * 3), y: by - 20 - i * 2 + fase * 5 };
            const punta = { x: bx + lado * (40 + i * 5), y: by + 30 - i * 2 + fase * 9 };
            seg(bx, by, rodilla.x, rodilla.y, 6.5 - i * 0.4, c.body);
            seg(rodilla.x, rodilla.y, punta.x, punta.y, 4.6 - i * 0.3, dk);
            ell(punta.x, punta.y + 2, 3, 2, dk);
          }
        }
        ctx.save();
        ctx.scale(1, A.resp);
        // abdomen grande atras
        ell(-30, -8, 30, 26, c.body);
        ell(-30, -8, 20, 17, c.belly);
        // marca en el abdomen
        ctx.fillStyle = c.ojo;
        poly(
          [
            [-30, -20],
            [-24, -8],
            [-30, 4],
            [-36, -8],
          ],
          c.ojo,
        );
        // cefalotorax
        ell(8, -6, 22, 17, shade(c.body, 8));
        ctx.restore();
        // pelos
        ctx.strokeStyle = c.pelo;
        ctx.lineWidth = 1.4;
        for (let a = 0; a < 8; a++) {
          const ang = a * 0.785;
          ctx.beginPath();
          ctx.moveTo(-30 + Math.cos(ang) * 26, -8 + Math.sin(ang) * 22);
          ctx.lineTo(-30 + Math.cos(ang) * 33, -8 + Math.sin(ang) * 28);
          ctx.stroke();
        }
        // quelíceros que se abren al atacar
        const q = A.th * 8;
        poly(
          [
            [24, -2],
            [36 + q, 2 + q],
            [26, 6],
          ],
          c.quelicero,
          'rgba(0,0,0,.3)',
          1.1,
        );
        poly(
          [
            [24, 2],
            [36 + q, 10 + q],
            [26, 10],
          ],
          c.quelicero,
          'rgba(0,0,0,.3)',
          1.1,
        );
        // ocho ojos: dos grandes al frente y seis chicos
        ojosBrillo(20, -10, 6, 2.6, c.ojo, c.halo);
        ctx.fillStyle = shade(c.ojo, -30);
        [
          [12, -16],
          [18, -18],
          [24, -17],
          [12, -4],
          [26, -4],
          [6, -11],
        ].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x, y, 1.5, 0, Math.PI * 2);
          ctx.fill();
        });
        if (A.cast > 0.02) {
          // hilo de tela al conjurar
          ctx.strokeStyle = `rgba(220,210,235,${0.5 * A.cast})`;
          ctx.lineWidth = 1.6;
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(30, 2);
            ctx.quadraticCurveTo(60 + i * 10, -16 + i * 12, 80 + A.cast * 40, -24 + i * 18);
            ctx.stroke();
          }
        }
      },
    },
  });

  /* Ajuste de apoyo medido por criatura: sin esto unas quedan flotando y
   otras enterradas respecto a la sombra que dibuja el mundo. */
  const PIE = {
    wolf: -11,
    bear: 13,
    drake: -13,
    dragon: 15,
    troll: 41,
    orc: 25,
    ghoul: 15,
    zombie: 23,
    skeleton: 10,
    boneMage: -14,
    wraith: -30,
    lich: -14,
    boar: -17,
    spider: -72,
  };
  function drawMonstruoLocal(v) {
    const m = MONSTRUOS[v.beast] || MONSTRUOS.wolf;
    const A = marcha(m.plan);
    // La paleta del juego manda sobre la del catalogo: asi las variantes
    // Notable y Exaltado siguen cambiando de color.
    const col = { ...m.col, ...(v.palette || {}) };
    ctx.save();
    ctx.translate(0, -(PIE[v.beast] || 0));
    ctx.rotate(A.pitch || 0);
    m.draw(A, col);
    ctx.restore();
  }

  U.CharacterRenderer = {
    draw(c, visual, scale = 0.32) {
      ctx = c;
      applyVisual(visual || {});
      if (visual?.beast) {
        c.save();
        c.scale(scale, scale);
        const golpe = clamp(visual.hit || 0, 0, 1);
        if (golpe > 0) {
          const empuje = Math.sin(golpe * Math.PI * 0.5) * 7;
          const lado = visual.dir === 'right' ? -1 : visual.dir === 'left' ? 1 : 0;
          c.translate(empuje * lado, empuje * 0.3);
          c.rotate(lado * Math.sin(golpe * Math.PI * 0.5) * 0.06);
        }
        if (visual.dying) {
          const caida = clamp(visual.death || 0, 0, 1);
          c.translate(0, 46 * caida);
          c.rotate(caida * 1.4);
          c.globalAlpha = Math.max(0.2, 1 - caida * 0.75);
        }
        if (visual.dir === 'left') c.scale(-1, 1);
        drawMonstruoLocal(visual);
        c.restore();
        return;
      }
      const base = {
        gender: 'male',
        skin: '#bb8d72',
        underwear: '#39414a',
        shirt: '#677386',
        pants: '#566479',
        tunic: '#7d586a',
        armor: '#8d98a1',
        cape: '#56303c',
        hair: '#3b2a24',
        ...(visual?.base || {}),
      };
      c.save();
      c.scale(scale, scale);
      // Conserva el punto de apoyo del renderer anterior: los pies deben
      // terminar sobre la sombra del mundo, no debajo de ella.
      c.translate(0, -22);
      drawHuman(base);
      drawCapeHood(base, state.dir);
      c.restore();
    },
  };
})((window.Ultra = window.Ultra || {}));

</script>
<script>
(function () {
  const U = window.Ultra;
  const canvas = document.getElementById('preview');
  const ctx = canvas.getContext('2d');

  // ── Actor de prueba: reusa U.player (ya trae equipment/skills válidos) ──
  const actor = U.player;
  actor.facing = 'down';
  actor.moving = false;
  actor.attackAnim = 0; actor.attackTotal = 0.42;
  actor.castAnim = 0; actor.casting = null;
  actor.hitAnim = 0;
  actor.dead = false; actor.deathAnim = 0; actor.deathTotal = 1.8;
  actor.anim = 0;

  let speed = 1, zoom = 1.34, loopRepeat = true, currentAction = 'idle';

  // ── Direcciones ──
  const DIRS = [
    ['down', 'Abajo'], ['up', 'Arriba'], ['left', 'Izquierda'], ['right', 'Derecha'],
  ];
  const dirWrap = document.getElementById('dir-buttons');
  DIRS.forEach(([id, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { actor.facing = id; refreshActive(dirWrap, b); };
    dirWrap.appendChild(b);
    if (id === 'down') b.classList.add('active');
  });
  function refreshActive(wrap, active) {
    [...wrap.children].forEach(c => c.classList.toggle('active', c === active));
  }

  // ── Acciones ──
  const ACTIONS = [
    ['idle', 'Reposo'], ['walk', 'Caminar'], ['melee', 'Golpe'],
    ['cast', 'Conjurar'], ['hurt', 'Recibir daño'], ['death', 'Morir'], ['revive', 'Revivir'],
  ];
  const actWrap = document.getElementById('action-buttons');
  const actionButtons = {};
  ACTIONS.forEach(([id, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => setAction(id);
    actWrap.appendChild(b);
    actionButtons[id] = b;
    if (id === 'idle') b.classList.add('active');
  });

  function resetTimers() {
    actor.attackAnim = 0;
    actor.castAnim = 0;
    actor.casting = null;
    actor.hitAnim = 0;
    actor.moving = false;
  }

  function setAction(id) {
    if (id === 'revive') {
      actor.dead = false; actor.deathAnim = 0;
      resetTimers();
      currentAction = 'idle';
      refreshActive(actWrap, actionButtons.idle);
      return;
    }
    resetTimers();
    if (id !== 'death') { actor.dead = false; actor.deathAnim = 0; }
    currentAction = id;
    refreshActive(actWrap, actionButtons[id]);
    if (id === 'walk') actor.moving = true;
    if (id === 'melee') { actor.attackTotal = 0.42; actor.attackAnim = 0.42; }
    if (id === 'cast') { const t = 1.55; actor.casting = { t, total: t }; actor.castAnim = t; }
    if (id === 'hurt') actor.hitAnim = 0.22;
    if (id === 'death') { actor.dead = true; actor.deathTotal = 1.8; actor.deathAnim = 1.8; }
  }

  // ── Equipo real, tomado de U.itemDefs ──
  function fillSelect(select, filterFn, placeholder) {
    select.innerHTML = '';
    const none = document.createElement('option');
    none.value = ''; none.textContent = placeholder;
    select.appendChild(none);
    Object.entries(U.itemDefs).filter(([id, d]) => filterFn(id, d)).forEach(([id, d]) => {
      const o = document.createElement('option');
      o.value = id; o.textContent = d.name;
      select.appendChild(o);
    });
  }
  const weaponSelect = document.getElementById('weapon-select');
  const offhandSelect = document.getElementById('offhand-select');
  const chestSelect = document.getElementById('chest-select');

  fillSelect(weaponSelect, (id, d) => d.slot === 'weapon', '— Sin arma —');
  fillSelect(offhandSelect, (id, d) => d.slot === 'shield' || d.type === 'spellbook', '— Vacía —');
  fillSelect(chestSelect, (id, d) => d.slot === 'chest', '— Sin armadura —');

  function equipItem(slot, id) {
    if (!id) { delete actor.equipment[slot]; return; }
    const inst = U.createEquipmentInstance(id) || { id, qty: 1 };
    actor.equipment[slot] = inst;
  }
  weaponSelect.onchange = () => equipItem('weapon', weaponSelect.value);
  offhandSelect.onchange = () => equipItem('shield', offhandSelect.value);
  chestSelect.onchange = () => equipItem('chest', chestSelect.value);
  document.getElementById('cloak-toggle').onchange = e => equipItem('cloak', e.target.checked ? 'cloak' : '');
  document.getElementById('robe-toggle').onchange = e => equipItem('robe', e.target.checked ? 'robe' : '');
  document.getElementById('loop-toggle').onchange = e => (loopRepeat = e.target.checked);

  // ── Velocidad / zoom ──
  const speedInput = document.getElementById('speed'), speedVal = document.getElementById('speed-val');
  speedInput.oninput = () => { speed = speedInput.value / 100; speedVal.textContent = speed.toFixed(2) + 'x'; };
  const zoomInput = document.getElementById('zoom'), zoomVal = document.getElementById('zoom-val');
  zoomInput.oninput = () => { zoom = zoomInput.value / 100; zoomVal.textContent = zoom.toFixed(2); };

  // ── Loop de animación: replica exactamente cómo game.js descuenta los timers ──
  let last = performance.now();
  const hudInfo = document.getElementById('hud-info');
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * speed;
    last = now;
    actor.anim = (actor.anim || 0) + dt;

    if (currentAction === 'melee') {
      actor.attackAnim = Math.max(0, actor.attackAnim - dt);
      if (actor.attackAnim === 0 && loopRepeat) actor.attackAnim = actor.attackTotal;
    }
    if (currentAction === 'cast' && actor.casting) {
      actor.casting.t = Math.max(0, actor.casting.t - dt);
      actor.castAnim = Math.max(0, actor.castAnim - dt);
      if (actor.castAnim === 0 && loopRepeat) { actor.casting.t = actor.casting.total; actor.castAnim = actor.casting.total; }
    }
    if (currentAction === 'hurt') {
      actor.hitAnim = Math.max(0, actor.hitAnim - dt);
      if (actor.hitAnim === 0 && loopRepeat) actor.hitAnim = 0.22;
    }
    if (currentAction === 'death') {
      actor.deathAnim = Math.max(0, actor.deathAnim - dt);
      if (actor.deathAnim === 0 && loopRepeat) actor.deathAnim = actor.deathTotal;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2 + 90);
    const visual = U.CharacterAdapter.getState(actor, {});
    U.CharacterRenderer.draw(ctx, visual, zoom);
    ctx.restore();

    hudInfo.textContent = `acción: ${currentAction} · dir: ${actor.facing}`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
