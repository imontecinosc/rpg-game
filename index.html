<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#17130f" />
  <title>Proyecto Ultra V5.0</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/hud.css" />
  <link rel="stylesheet" href="./css/menus.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game-canvas" aria-label="Mundo de Proyecto Ultra"></canvas>

    <section id="hud-top" class="hud-layer">
      <div class="status-cluster">
        <div class="portrait">IM</div>
        <div class="bars">
          <div class="bar"><span>Vida</span><i id="hp-bar"></i><b id="hp-text"></b></div>
          <div class="bar mana"><span>Maná</span><i id="mana-bar"></i><b id="mana-text"></b></div>
          <div class="bar stamina"><span>Aguante</span><i id="stamina-bar"></i><b id="stamina-text"></b></div>
        </div>
      </div>
      <div class="top-actions">
        <button id="battle-toggle" class="icon-btn">🛡️</button>
        <button id="open-skills" class="icon-btn">📜</button>
        <button id="open-inventory" class="icon-btn">🎒</button>
        <button id="open-crafting" class="icon-btn">⚒️</button>
      </div>
    </section>

    <section id="hud-bottom" class="hud-layer">
      <div id="joystick" class="joystick" aria-label="Control de movimiento">
        <div id="joystick-knob"></div>
      </div>
      <div class="action-grid">
        <button id="attack-btn" class="action primary">⚔️<span>Atacar</span></button>
        <button id="spell-btn" class="action">🔥<span>Magia</span></button>
        <button id="heal-btn" class="action">✚<span>Curar</span></button>
        <button id="use-btn" class="action">✋<span>Usar</span></button>
        <button id="gather-btn" class="action">⛏️<span>Recolectar</span></button>
        <button id="potion-btn" class="action">🧪<span>Poción</span><b id="potion-count">0</b></button>
      </div>
    </section>

    <aside id="toast-stack" aria-live="polite"></aside>

    <dialog id="inventory-dialog" class="game-dialog">
      <header><h2>Inventario y equipo</h2><button data-close>✕</button></header>
      <div class="inventory-layout">
        <section class="equipment-panel">
          <div class="paperdoll" id="paperdoll"></div>
          <div id="equipment-slots" class="equipment-slots"></div>
        </section>
        <section>
          <div class="menu-toolbar">
            <span id="inventory-weight">Slots 0/60</span>
            <button id="sort-inventory">Ordenar</button>
          </div>
          <div id="inventory-grid" class="inventory-grid"></div>
          <div id="item-detail" class="item-detail">Selecciona un objeto.</div>
        </section>
      </div>
    </dialog>

    <dialog id="skills-dialog" class="game-dialog wide">
      <header><h2>Habilidades</h2><button data-close>✕</button></header>
      <div class="skill-summary">
        <strong id="skill-total">0 / 650</strong>
        <span>Cap total provisional</span>
      </div>
      <div id="skills-list" class="skills-list"></div>
    </dialog>

    <dialog id="crafting-dialog" class="game-dialog wide">
      <header><h2>Artesanía</h2><button data-close>✕</button></header>
      <div class="crafting-layout">
        <nav id="crafting-categories"></nav>
        <section id="recipe-list"></section>
      </div>
    </dialog>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
