<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#10100f" />
  <title>Proyecto Ultra V5.1</title>
  <link rel="stylesheet" href="./css/game.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game" aria-label="Proyecto Ultra"></canvas>
    <div id="error-box" hidden></div>

    <header id="hud-top" class="hud-layer">
      <section class="player-status">
        <div class="portrait">IM</div>
        <div class="bars">
          <div class="bar hp"><span>Vida</span><i id="hp-fill"></i><b id="hp-text"></b></div>
          <div class="bar mana"><span>Maná</span><i id="mana-fill"></i><b id="mana-text"></b></div>
          <div class="bar stam"><span>Aguante</span><i id="stam-fill"></i><b id="stam-text"></b></div>
        </div>
      </section>
      <section class="top-buttons">
        <button id="skills-btn" title="Habilidades">📜</button>
        <button id="inventory-btn" title="Inventario">🎒</button>
        <button id="craft-btn" title="Artesanía">⚒️</button>
        <button id="world-btn" title="Mundo">🗺️</button>
        <button id="settings-btn" title="Ajustes">⚙️</button>
      </section>
    </header>

    <div id="target-card" hidden><strong id="target-name"></strong><span id="target-hp"></span></div>
    <div id="location-card"><strong id="location-name">Valdoria</strong><span id="coords"></span></div>

    <section id="specials" class="hud-layer">
      <button id="special-60" disabled>60</button>
      <button id="special-80" disabled>80</button>
    </section>

    <section id="hud-bottom" class="hud-layer">
      <div id="joystick"><div id="stick"></div></div>
      <div id="spell-strip"></div>
      <div class="actions">
        <button id="battle-btn" class="action peace">🛡️<span>Paz</span></button>
        <button id="attack-btn" class="action" hidden>⚔️<span>Atacar</span></button>
        <button id="heal-btn" class="action">✚<span>Curar</span></button>
        <button id="use-btn" class="action">✋<span>Usar</span></button>
        <button id="potion-btn" class="action">🧪<span>Poción</span><b id="potion-count">0</b></button>
      </div>
    </section>

    <aside id="toasts" aria-live="polite"></aside>

    <dialog id="inventory-dialog" class="game-dialog">
      <header><h2>Equipo e inventario</h2><button data-close>✕</button></header>
      <div class="equipment-layout">
        <section class="paperdoll-panel">
          <div id="paperdoll"><div class="paper-head"></div><div class="paper-body"></div><div class="paper-legs"></div></div>
          <div id="equipment-slots"></div>
        </section>
        <section class="inventory-panel">
          <div class="toolbar"><span id="inventory-slots"></span><button id="sort-btn">Ordenar</button></div>
          <div id="inventory-grid"></div>
          <div id="item-detail">Selecciona un objeto.</div>
        </section>
      </div>
    </dialog>

    <dialog id="skills-dialog" class="game-dialog wide">
      <header><h2>Habilidades</h2><button data-close>✕</button></header>
      <div class="skill-head"><b id="skill-total"></b><span>Cap total: 650</span></div>
      <div id="skills-list"></div>
    </dialog>

    <dialog id="craft-dialog" class="game-dialog wide">
      <header><h2>Artesanía y recolección</h2><button data-close>✕</button></header>
      <div class="craft-layout"><nav id="craft-tabs"></nav><section id="recipe-list"></section></div>
    </dialog>

    <dialog id="world-dialog" class="game-dialog wide">
      <header><h2>Mundo, vivienda y servicios</h2><button data-close>✕</button></header>
      <div class="world-grid">
        <section><h3>Ciudades</h3><div id="city-list"></div></section>
        <section><h3>Casa</h3><div id="house-panel"></div></section>
        <section><h3>Banco</h3><div id="bank-panel"></div></section>
      </div>
    </dialog>

    <dialog id="vendor-dialog" class="game-dialog wide">
      <header><h2 id="vendor-title">Comerciante</h2><button data-close>✕</button></header>
      <div class="vendor-layout"><section><h3>Comprar</h3><div id="vendor-buy"></div></section><section><h3>Vender</h3><div id="vendor-sell"></div></section></div>
    </dialog>

    <dialog id="corpse-dialog" class="game-dialog">
      <header><h2>Cadáver</h2><button data-close>✕</button></header>
      <div id="corpse-items"></div>
    </dialog>

    <dialog id="settings-dialog" class="game-dialog">
      <header><h2>Ajustes</h2><button data-close>✕</button></header>
      <div class="settings-list">
        <button id="save-btn">Guardar partida</button>
        <button id="load-btn">Cargar partida</button>
        <button id="reset-btn">Reiniciar partida</button>
      </div>
    </dialog>
  </main>
  <script src="./js/game.bundle.js"></script>
</body>
</html>
